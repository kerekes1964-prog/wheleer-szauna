backend:
  name: github
  repo: kerekes1964-prog/wheleer-szauna
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "programok"
    label: "Szaunaprogramok"
    folder: "programok"
    create: true
    fields:
      - {label: "Program neve", name: "title", widget: "string"}
      - {label: "Dátum", name: "date", widget: "datetime"}
      - {label: "Leírás", name: "body", widget: "markdown"}
      - {label: "Kép", name: "image", widget: "image", required: false}
